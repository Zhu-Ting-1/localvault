<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录页带注册链接（不应判为注册）</title>
  <link rel="stylesheet" href="fixture.css">
</head>
<body>
  <div class="card">
    <a class="back" href="index.html">返回</a>
    <h1>账号登录</h1>
    <p class="sub">复刻淘宝 / 12306 / 网易邮箱这类登录页：表单里出现「免费注册」链接，按钮文案写作「登 录」（字间带空格），但实际只有一个密码框。</p>

    <form id="login-form" class="form">
      <label for="fm-login-id">账号名 / 邮箱 / 手机号</label>
      <input type="text" id="fm-login-id" name="fm-login-id" autocomplete="username" placeholder="请输入账号">

      <label for="fm-login-password">密码</label>
      <input type="password" id="fm-login-password" name="fm-login-password" autocomplete="current-password" placeholder="请输入密码">

      <button type="submit">登 录</button>

      <p class="hint">还没有账号？<a href="#">免费注册</a> · <a href="#">忘记密码</a></p>
    </form>
  </div>
</body>
</html>
