<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow DOM 登录</title><link rel="stylesheet" href="fixture.css"></head>
<body>
  <div class="card">
    <a class="back" href="index.html">← 返回测试集</a>
    <h1>登录 Shadow DOM</h1>
    <p class="sub">密码框在 open shadow root 内，外部 CSS/选择器默认看不到。</p>
    <div id="shadow-host"></div>
    <div class="note">预期：能穿透 open shadow root 找到密码框；用户名通过 name 配对。</div>
  </div>
  <script>
    var host = document.getElementById('shadow-host');
    var root = host.attachShadow({ mode: 'open' });
    root.innerHTML = [
      '<style>',
      'label{display:block;margin:12px 0 6px;font-size:11.5px;color:#647086}',
      'input{width:100%;height:42px;padding:0 12px;border:1px solid #d7e2f1;border-radius:10px;font:14px/1.6 sans-serif;box-sizing:border-box}',
      'button{width:100%;height:42px;margin-top:18px;border:0;border-radius:10px;background:#0a7cff;color:#fff;font-weight:600}',
      '</style>',
      '<form id="shadow-form" action="#" onsubmit="return false">',
      '<label for="shadow-user">用户名</label>',
      '<input id="shadow-user" name="username" autocomplete="username">',
      '<label for="shadow-pass">密码</label>',
      '<input id="shadow-pass" name="password" type="password" autocomplete="current-password">',
      '<button type="submit">登录</button>',
      '</form>',
    ].join('');
  </script>
</body>
</html>
